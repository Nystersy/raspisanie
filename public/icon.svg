<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Фон со скруглением -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Белая карточка-расписание -->
  <rect x="128" y="120" width="256" height="272" rx="28" fill="#ffffff"/>
  <!-- Верхняя полоска (шапка календаря) -->
  <rect x="128" y="120" width="256" height="60" rx="28" fill="#0f766e"/>
  <rect x="128" y="150" width="256" height="30" fill="#0f766e"/>
  <!-- Два "кольца" календаря сверху -->
  <rect x="180" y="100" width="20" height="56" rx="10" fill="#0f766e"/>
  <rect x="312" y="100" width="20" height="56" rx="10" fill="#0f766e"/>
  <!-- Медицинский крест на карточке -->
  <rect x="232" y="210" width="48" height="148" rx="12" fill="#14b8a6"/>
  <rect x="182" y="260" width="148" height="48" rx="12" fill="#14b8a6"/>
</svg>
